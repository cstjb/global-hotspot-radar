[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-hotspot-radar"
version = "0.1.0"
description = "AI-assisted global news event radar powered by GDELT, RSS, DuckDB and a static dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.2,<2",
  "feedparser>=6.0.11,<7",
  "python-dateutil>=2.9,<3",
  "pytz>=2025.2",
  "requests>=2.32,<3",
]

[project.scripts]
hotspot-radar = "hotspot_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
