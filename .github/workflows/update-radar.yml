name: Update global hotspot radar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-global-hotspot-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Build radar data
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        run: python -m hotspot_radar.cli run

      - name: Commit refreshed data
        run: |
          git config user.name "global-hotspot-radar[bot]"
          git config user.email "global-hotspot-radar[bot]@users.noreply.github.com"
          git add docs/data/events.json data/hotspots.duckdb
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh global hotspot radar"
            git push
          fi

